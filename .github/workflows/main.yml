name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only for the release step on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Finds the folder that holds settings.gradle, so it works whether the
      # project sits at the repo root or inside a subfolder like bennytools/.
      - name: Locate Gradle project
        run: |
          SETTINGS=$(find . -maxdepth 3 -name 'settings.gradle*' -not -path './.git/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle found. Commit the project files (settings.gradle, build.gradle, gradle.properties, src/) to the repo."
            echo "Files in repo:"; find . -maxdepth 2 -not -path './.git*' | sort
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project directory: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Installs Gradle itself, so you don't have to commit the wrapper.
      # (9.1+ is required for running on JDK 25.)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: bennytools-jar
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
          if-no-files-found: error

      # Pushing a tag like v1.0.0 also publishes the jar as a GitHub release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
